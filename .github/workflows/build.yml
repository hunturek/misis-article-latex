name: Build

on:
  push:
  pull_request:

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: "0.17.0"

      - name: Build template
        run: mkdir -p build && tectonic -o build article.tex

      - name: Build example
        working-directory: example
        run: mkdir -p build && tectonic -o build example.tex
